<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萌乐多儿童乐园 - 二维码更新</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;background:#FFF5F5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:36px 28px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(255,107,129,.15);text-align:center}
h1{color:#FF6B81;font-size:20px;margin-bottom:6px}
h2{color:#666;font-size:15px;font-weight:400;margin-bottom:20px}
.tip-box{background:#FFF0F3;border-radius:14px;padding:14px;margin-bottom:20px;font-size:13px;color:#E8456A;line-height:1.7}
.qr-section{margin-bottom:20px}
.qr-label{font-size:15px;font-weight:600;color:#333;margin-bottom:10px}
.qr-wrap{display:inline-block;background:#fff;padding:10px;border-radius:14px;border:2px solid #FFE0E6}
.qr-wrap img{display:block;width:220px;height:220px}
.save-hint{font-size:12px;color:#999;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>萌乐多儿童乐园</h1>
  <h2>会员端二维码已更新</h2>
  <div class="tip-box">
    您扫描的旧二维码已停用，请使用下方新二维码。<br>
    <strong>长按新二维码图片，选择"保存图片"保存到手机相册。</strong>
  </div>
  <div class="qr-section">
    <div class="qr-label">会员端新二维码</div>
    <div class="qr-wrap">
      <img src="qrcode-member.png" alt="会员端新二维码">
    </div>
    <div class="save-hint">长按图片 → 保存到相册</div>
  </div>
</div>
</body>
</html>
